# Пример профиля для тревел-бренда: ролики 30–60 секунд, часть из них воронки.
# Скопируйте в brand.toml и поправьте под себя.

[brand]
name = "Белла"
niche = "путешествия: куда поехать, как сэкономить и не ошибиться с выбором"
audience = "люди 25–40 лет, которые планируют отпуск и ищут идеи и проверенные советы"
tone = "дружелюбно и вдохновляюще, на «ты», коротко и с конкретикой: места, цены, сезоны"
language = "ru-RU"
posts_per_week = 5
# Длина ролика в секундах. 0 означает обычные 30–60 секунд;
# для коротких роликов-воронок можно поставить, например, 10.
video_seconds = 0
stop_words = ["райский уголок", "незабываемые впечатления", "лайфхак", "друзья"]
example_texts = []

[[rubrics]]
name = "Место"
description = "одно конкретное место, о котором мало кто знает, и чем оно цепляет"

[[rubrics]]
name = "Деньги"
description = "сколько стоит поездка или как сэкономить на одном конкретном пункте"

[[rubrics]]
name = "Ошибка"
description = "частая ошибка туристов и как её избежать"

[[rubrics]]
name = "Воронка"
description = "интрига без ответа, ответ и подробности в профиле или по ссылке"

[video]
voice_name = "ru-RU-SvetlanaNeural-Female"
video_aspect = "9:16"
paragraph_number = 1
font_name = "MicrosoftYaHeiBold.ttc"
video_source = "pexels"
