# Профиль личного бренда для brand_plan.py.
# Скопируйте файл в brand.toml и замените значения на свои.
# brand.toml не попадает в git (см. .gitignore).

[brand]
# Как к вам обращаться в сценариях и от чьего имени говорить.
name = "Белла"
# О чём бренд: тема, в которой вы эксперт.
niche = "эксперт делится личным опытом и практическими советами"
# Для кого контент.
audience = "люди 25–40 лет, которые хотят расти в профессии и жить осознанно"
# Как звучат тексты.
tone = "дружелюбный эксперт, обращение на «ты», живой разговорный язык, без канцелярита"
# Язык озвучки и субтитров.
language = "ru-RU"
# Сколько роликов в неделю предлагать в контент-плане.
posts_per_week = 3
# Слова и обороты, которых не должно быть в сценариях.
stop_words = ["уникальный", "лайфхак", "в современном мире", "друзья"]
# Пара ваших реальных текстов: по ним модель подхватывает голос.
example_texts = []

# Рубрики контент-плана. Темы распределяются по рубрикам по очереди.
[[rubrics]]
name = "Польза"
description = "конкретный совет или инструкция, которую можно применить сегодня"

[[rubrics]]
name = "Личное"
description = "история из жизни или работы, вывод из неё"

[[rubrics]]
name = "Разбор"
description = "разбор частой ошибки или мифа в нише"

[video]
# Голос Edge TTS. Мужской вариант: ru-RU-DmitryNeural-Male.
voice_name = "ru-RU-SvetlanaNeural-Female"
# 9:16 для Reels, TikTok и Shorts.
video_aspect = "9:16"
# 1 абзац примерно равен ролику на 30–60 секунд.
paragraph_number = 1
# Шрифт субтитров с кириллицей из resource/fonts.
font_name = "MicrosoftYaHeiBold.ttc"
video_source = "pexels"
